  { at = 5.0, pose = "same, on the alley floor: the kitten bumping into Friend, Codubee leaning his side and shoulder into Friend's front leg, and Friend nudged a little sideways off its step; paws on the ground", avoid = "gap between the cats, floating, cats in mid-air, cats on top of the fence" },
]
action = "they trot down the alley; the kitten bumps playfully against Friend, relaxed and close"

[[shots]]
id = "s050"
set = "alley_dusk"
seconds = 3
camera = "medium"
cast = ["cat:kitten2eye", "friend:teen"]
keys = [{ at = 0.0, pose = "standing on the alley floor: the black kitten Codubee on the left and Friend, a WHITE cat drawn only in outline, on the right; Friend turns its head to Codubee with a sly grin; exactly two cats, only one of them black", avoid = "two black cats, three cats, floating, cats on top of the fence" }]
lines = [{ who = "friend", text = "Race you to the yard.", at = 0.5, how = "teasing" }]

[[shots]]
id = "s060"
set = "alley_dusk"
seconds = 4
camera = "wide"
cast = ["cat:kitten2eye", "friend:teen"]
keys = [
  { at = 0.0, pose = "both cats skidding to a sudden stop on the alley floor: all four paws planted, legs slightly splayed out, bodies low, ears up, a little dust kicked up behind their paws; Codubee on the left, Friend on the right", avoid = "floating, cats in mid-air, cats on top of the fence, walking" },
  { at = 4.0, props = ["dog"], pose = "the dog's head and front paws pushing out from the gap under the bottom of the fence right beside the two cats as they pass it, low and sneaking, about to spring at them", avoid = "dog on top of the fence, dog standing in the alley, dog far away" },
]
