[[shots]]
id = "s070"
set = "alley_dusk"
seconds = 4
camera = "wide"
move = "pan_right"
cast = ["cat:kitten2eye", "friend:teen"]
keys = [
  { at = 0.0, pose = "both cats running right down the alley" },
  { at = 4.0, props = ["dog"], pose = "the dog, large and clearly visible in the frame, squeezing out from the gap under the fence behind the two running cats, snarling; only the two cats and the dog", avoid = "dog hidden, dog too small to see" },
]
action = "they bolt down the alley; the dog bursts through the fence after them"
sfx = [{ what = "paws scrabbling on gravel", at = 0.5 }, { what = "barking, closer", at = 1.5 }]

[[shots]]
id = "s080"
set = "alley_dusk"
seconds = 4
camera = "medium"
move = "shake"
cast = ["cat:kitten2eye", "friend:teen"]
keys = [
  { at = 0.0, props = ["dog"], pose = "Friend launching itself off Codubee's back to get away: Friend in the air above Codubee, its hind legs pushing down hard on Codubee's back, and Codubee shoved sideways, stumbling, legs buckling; behind them the dog has just come through the gap under the fence into the alley", avoid = "Friend sitting on Codubee, Friend lying on top of Codubee, Friend leaping beside Codubee, missing iris, blank eye" },
  { at = 4.0, cast = ["cat:kitten2eye"], props = ["dog"], pose = "Friend gone from the frame; the dog's open jaws inches from Codubee, who scrambles on the ground to get away; both of Codubee's eyes open with round pupils", avoid = "second cat, Friend, missing iris, blank eye" },
]
action = "Friend uses Codubee as a springboard and escapes; the kitten, pushed down, can't run fast enough and the dog is on him"
