[[shots]]
id = "s090"
set = "alley_dusk"
seconds = 4
camera = "medium"
cast = ["cat:kitten2eye"]
music = "silence"     # the dread pulse stops dead as he slips away
keys = [
  { at = 0.0, props = ["dog"], pose = "Codubee wriggling free of the dog and darting away to the LEFT, facing left, towards a narrow gap between two boards of the fence on the left side of the alley; the dog behind him on the right; Codubee is the only black animal in the frame", avoid = "two black cats, second black cat, Codubee facing right, Codubee running towards the dog" },
  { at = 4.0, props = ["dog"], pose = "Codubee squeezing his body through the narrow gap between two fence boards on the left, half way through: only his back half and tail still on this side of the fence; the dog behind on the right, too big to follow", avoid = "two black cats, second black cat, Codubee in the open, Codubee under the fence" },
]
action = "Codubee wriggles free and squeezes under the fence, barely"
sfx = [{ what = "claws on wood", at = 1.0 }, { what = "barking, muffled behind the fence, fading", at = 3.0 }]

# ================================================================== EXT. YARD - LATER
[[shots]]
id = "s100"
set = "yard_dusk"
seconds = 5
camera = "wide"
cast = ["cat:kitten2eye", "friend:teen"]
music = "after"
keys = [
  { at = 0.0, pose = "a little later in the yard: Codubee, ruffled, his fur sticking out in messy tufts, walking up to Friend, who sits licking a front paw, completely unbothered, with a smug smirk: one corner of its mouth curled up, eyes half-closed and lazy; Friend has exactly four legs", avoid = "big smile, open grin, happy face, extra legs, five legs, six legs" },
  { at = 5.0, pose = "Friend's head turned away, glancing sideways out of the corner of its half-lidded eyes at Codubee with a smug, one-sided smirk; Codubee ruffled, stopped still, looking at Friend; Friend has exactly four legs", avoid = "wink, winking, one eye closed, big smile, facing Codubee, extra legs, five legs, six legs" },
]
action = "the kitten finds Friend again; Friend couldn't care less about what just happened"
sfx = [{ what = "a few soft licks", at = 1.0 }]

[[shots]]
id = "s110"
set = "yard_dusk"
seconds = 4
camera = "close"
move = "push_in"
cast = ["cat:kitten2eye"]
keys = [
  { at = 0.0, pose = "Codubee's face, two eyes, looking at Friend off screen" },
  { at = 4.0, pose = "Codubee frowning as he realises Friend put its own safety before his: eyes narrowed, mouth turned down; no eyebrows", avoid = "eyebrows, brows" },
]
action = "understanding dawns: this friend was never looking out for him"
transition = "match_dissolve"   # the kitten's face dissolves into the teen's: years pass in one cut
sfx = [{ what = "breathing", at = 0.0 }]

# ================================================================== YEARS LATER
[[shots]]
id = "s120"
set = "yard_dusk"
seconds = 4
camera = "close"
# Colby, 2026-10-21: kittens never have a third eye. The lesson lands years later: teen Codubee,
# same framing as s110, and the eye opens on the teen.
# Colby, 2026-10-29: the teen came out skinny and angular, nothing like the kitten; and the eye
# "just seems to emerge into existence" when it "should just open like a regular eye lid", with
# frames in between. So: keep the kitten's build, and four keys from closed lid to open eye.
cast = ["cat:2eye", "cat:3eye"]   # the hero moment: the variant changes during the shot
keys = [
  { at = 0.0, cast = ["cat:2eye"], pose = "the teenage Codubee's face, two eyes, the same look of understanding, tears starting to well up along the bottom of both eyes, drawn as clear white droplets; the same round, full head and soft proportions as in image 2", avoid = "skinny, angular, thin face, long snout, black drips" },
  { at = 1.5, cast = ["cat:3eye"], pose = "the third eye still closed: a smooth closed eyelid in the middle of the forehead, drawn as one clean curved line; tears welling in his two lower eyes; the same round, full head and soft proportions as in image 2", avoid = "open third eye, sun, rays, lashes, notch, skinny, angular, thin face" },
  { at = 2.5, cast = ["cat:3eye"], pose = "the third eye halfway open in the middle of the forehead: its lid a smooth curve covering the top half of a round eye, the bottom half of the pupil showing; tears in his two lower eyes; the same round, full head and soft proportions as in image 2", avoid = "skinny, angular, thin face, narrow head, deformed eye" },
  { at = 4.0, cast = ["cat:3eye"], pose = "the third eye fully open in the middle of the forehead, round and the same shape as the lower eyes, its lid raised like a normal eyelid, all three eyes wide; the same round, full head and soft proportions as in image 2", avoid = "skinny, angular, thin face, narrow head, deformed eye" },
]
action = "the third eye's lid opens slowly on the forehead, like a waking eye"
sfx = [{ what = "a soft, low shimmer", at = 0.5 }]

[[shots]]
id = "s130"
set = "yard_dusk"
seconds = 5
camera = "extreme_close"
cast = ["cat:3eye"]
keys = [
  { at = 0.0, pose = "the third eye welling up with a tear, a clear water drop drawn white with a thin outline; the two lower eyes dry, plain and open, with no eyelids drawn on them; the same round, full head and soft proportions as in image 2", avoid = "eyelids on the lower eyes, heavy lids, blood, black drips, dark liquid, skinny, thin face" },
  { at = 3.0, pose = "a single clear tear, drawn white with a thin outline, running down from the third eye only; a few thin raindrop lines falling across the face; a gentle, sad, wistful expression with soft round eyes; the head whole and intact, the same round, full head and soft proportions as in image 2", avoid = "angry, evil, menacing, glaring, slanted eyes, furrowed brow, sharp teeth, blood, black drips, mangled head, broken outline, skinny, thin face" },
]
action = "a single tear runs from the third eye only; rain begins"
transition = "fade_out"
sfx = [{ what = "first raindrops", at = 2.5 }, { what = "rain building", at = 3.5 }]
