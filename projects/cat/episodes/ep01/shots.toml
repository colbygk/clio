# ep01 shot list — derived from script.fountain, then edited by hand. The source of truth for every
# downstream tool: bin/keys (key frames), bin/tween (motion between them), bin/sound (voice, foley,
# music) and bin/scratch (the Scratch project). Change a word here to re-direct a shot.
#
# Per shot:
#   id         s010, s020 … (gaps leave room to insert shots)
#   set        a [sets.*] entry below
#   seconds    on-screen duration; the timeline is the running sum
#   camera     wide | medium | close | extreme_close, plus optional move: "pan_right", "push_in", "shake"
#   cast       characters in frame: "<character>:<variant>" — character packages in ../../characters/
#   keys       key frames, in order. `at` is seconds into the shot; `pose` is what bin/keys directs;
#              an optional per-key `cast` overrides the shot's (s120: the variant changes mid-shot), and
#              an optional `avoid` adds to the negative prompt (what Colby saw and did not want).
#              Two keys = one in-between (bin/tween runs first->last frame between each pair).
#   action     the motion between keys, in words — what the in-between is directed with
#   lines      dialogue: who, text, `at` (seconds into the shot), how (delivery note)
#   sfx        sound cues: what, `at`; foley is generated to match, or Scratch plays it at that time
#   music      cue name from [music.*], starting at this shot
#   transition how this shot leaves: cut (default) | match_dissolve | fade_out
#   outline    false turns off the drawn sticker outline (pipeline/ink.py) for a shot where a solid
#              black thing that is not Codubee (the dog's shadow) would get one too

[meta]
title = "The Third Eye (test scene)"
fps = 16                 # Wan 2.2 A14B native; assembly interpolates to 24 if wanted
aspect = "16:9"
scratch_stage = [480, 360]   # Scratch's fixed stage; frames are letterboxed into it

# ---- characters this episode needs ------------------------------------------------------------
# The variant names here must exist in each package's character.toml.
#   cat:kitten2eye   young Codubee, two eyes (NEW variant — bigger head, shorter legs)
#   cat:2eye         teen Codubee, years later (s160 only, as the memory lands)
#   cat:3eye         teen Codubee once the third eye opens (s160-s170)
#   Colby, 2026-10-21: the betrayal happens to the KITTEN; kittens never have a third eye, so the
#   ending cuts forward to the teen and the eye opens there.
#   friend:teen      NEW character package — not designed yet
#   dog              never drawn as a character: a cast shadow only (a set element)

# ---- sets ------------------------------------------------------------------------------------
[sets.garden_morning]
describe = "back garden, tall grass and a few dandelions, morning sunlight"
[sets.alley_dusk]
describe = "narrow alley at dusk between wooden board fences, fallen leaves; a gap under one fence"
[sets.yard_dusk]
describe = "small yard on the far side of the fence at dusk"   # the rain is directed in s170, not the set

# ---- designs to hold to: drawings Colby picked from this episode (2026-10-29) ----------------
# Keys draw these characters from these crops instead of the package sheets (Episode.ref_for).
[refs]
"friend:teen" = "refs/friend_s040k1.png"   # "Friend doesn't match up design wise with s040 k1"
"cat:2eye" = "refs/teen_s120k0.png"        # the teen kept getting skinnier; hold to s120 k0's round head
"cat:3eye" = "refs/teen_s120k0.png"

# Props: drawn things that are not characters, listed per shot or key as props = [...]
[props.dog]
ref = "refs/dog_s080k1.png"                 # "a great dangerous looking dog ... the design guide"
describe = "the big, shaggy, dangerous-looking dog drawn in scratchy black ink hatching, with a long muzzle and bared teeth"

[music.play]
describe = "light, curious, plucked — kitten play"
[music.dread]
describe = "low pulse that rises under the chase, cuts out on the shove"
[music.silence]
describe = "nothing: the chase music cuts out"
[music.after]
describe = "a single sustained tone, almost silence; one soft melodic phrase as the tear falls"

# Rewritten 2026-10-22 from Colby's key-frame notes (review page): the dog breaks through the
# fence, Friend escapes by springing off Codubee, Codubee barely gets away, and later Friend is
# unbothered. Codubee is on the LEFT and Friend on the RIGHT in every two-shot, as in s070 k0.
# Revised 2026-10-29 from his notes on that round: the fence-top cats looked like they were floating,
# and s070 k0 (both running on the alley floor) is "a better place to end up instead of having them
# on the fences", so s040-s060 are on the ground too.

# ================================================================== EXT. BACK GARDEN - MORNING
[[shots]]
id = "s010"
set = "garden_morning"
seconds = 6
camera = "wide"
cast = ["cat:kitten2eye"]
music = "play"
keys = [
  { at = 0.0, pose = "crouched in tall grass, rear up, tail twitching, watching a moth above" },
  { at = 2.0, pose = "mid-air pounce, all four paws reaching for the moth" },
  { at = 6.0, pose = "after a tumble, the kitten rolls up and bats at a dandelion clock with one front paw; the same grass and dandelions as before; the kitten is the only animal in the frame, with nothing under it but grass", avoid = "second cat, extra creature, cat-shaped shadow, blob under the kitten" },
]
action = "the kitten pounces at the moth, misses, tumbles in the grass and comes up batting at a dandelion"
sfx = [{ what = "moth wings flutter", at = 0.5 }, { what = "soft thump and grass rustle", at = 3.5 }]

[[shots]]
id = "s020"
set = "garden_morning"
seconds = 5
camera = "medium"
cast = ["cat:kitten2eye"]
keys = [
  { at = 0.0, pose = "sitting up with a dandelion clock held close to its face" },
  { at = 3.0, pose = "the kitten blowing gently on the dandelion clock held up in front of its face: cheeks puffed out slightly, mouth a small round pucker; a few curved motion lines from its mouth to the dandelion head, and the seeds lifting off the TOP of the dandelion head and drifting away above it, trailing little motion lines", avoid = "wide open mouth, open-mouthed, smiling, seeds below the dandelion, seeds still on the stem" },
]
action = "the kitten blows on the dandelion and the seeds fly away on the wind"
lines = [{ who = "cat", text = "Again!", at = 3.5, how = "giggling, tiny voice" }]
sfx = [{ what = "a little puff of breath", at = 2.5 }, { what = "soft puff of seeds", at = 3.0 }]

[[shots]]
id = "s030"
set = "garden_morning"
seconds = 4
camera = "wide"
move = "tilt_up"
cast = ["cat:kitten2eye"]
keys = [
  { at = 0.0, pose = "the kitten small in the foreground, sitting and watching dandelion seeds drift upward, plain white sky" },
  { at = 4.0, pose = "the kitten watching the last seeds drift away over the garden fence, plain white sky" },
]
action = "the kitten watches the seeds drift away over the fence"
transition = "match_dissolve"

# ================================================================== EXT. ALLEY - DUSK
[[shots]]
id = "s040"
set = "alley_dusk"
seconds = 5
camera = "wide"
move = "pan_right"
