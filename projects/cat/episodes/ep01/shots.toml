# ep01 shot list — derived from script.fountain, then edited by hand. The source of truth for every
# downstream tool: bin/keys (key frames), bin/tween (motion between them), bin/sound (voice, foley,
# music) and bin/scratch (the Scratch project). Change a word here to re-direct a shot.
#
# Per shot:
#   id         s010, s020 … (gaps leave room to insert shots)
#   set        a [sets.*] entry below
#   seconds    on-screen duration; the timeline is the running sum
#   camera     wide | medium | close | extreme_close, plus optional move: "pan_right", "push_in", "shake"
#   cast       characters in frame: "<character>:<variant>" — character packages in ../../characters/
#   keys       key frames, in order. `at` is seconds into the shot; `pose` is what bin/keys directs.
#              Two keys = one in-between (bin/tween runs first->last frame between each pair).
#   action     the motion between keys, in words — what the in-between is directed with
#   lines      dialogue: who, text, `at` (seconds into the shot), how (delivery note)
#   sfx        sound cues: what, `at`; foley is generated to match, or Scratch plays it at that time
#   music      cue name from [music.*], starting at this shot
#   transition how this shot leaves: cut (default) | match_dissolve | fade_out

[meta]
title = "The Third Eye (test scene)"
fps = 16                 # Wan 2.2 A14B native; assembly interpolates to 24 if wanted
aspect = "16:9"
scratch_stage = [480, 360]   # Scratch's fixed stage; frames are letterboxed into it

# ---- characters this episode needs ------------------------------------------------------------
# The variant names here must exist in each package's character.toml.
#   cat:kitten2eye   young Codubee, two eyes (NEW variant — bigger head, shorter legs)
#   cat:2eye         teen Codubee before the change (exists: head only so far)
#   cat:3eye         teen Codubee after (exists: head + standing front)
#   friend:teen      NEW character package — not designed yet
#   dog              never drawn as a character: a cast shadow only (a set element)

# ---- sets ------------------------------------------------------------------------------------
[sets.garden_morning]
describe = "back garden, tall grass and a few dandelions, morning sunlight"
[sets.alley_dusk]
describe = "narrow alley at dusk between wooden board fences, fallen leaves; a gap under one fence"
[sets.yard_dusk]
describe = "small yard on the far side of the fence at dusk; later light rain"

[music.play]
describe = "light, curious, plucked — kitten play"
[music.dread]
describe = "low pulse that rises under the chase, cuts out on the shove"
[music.silence]
describe = "nothing: the chase music cuts out"
[music.after]
describe = "a single sustained tone, almost silence; one soft melodic phrase as the tear falls"

# ================================================================== EXT. BACK GARDEN - MORNING
[[shots]]
id = "s010"
set = "garden_morning"
seconds = 5
camera = "wide"
cast = ["cat:kitten2eye"]
music = "play"
keys = [
  { at = 0.0, pose = "crouched in tall grass, rear up, tail twitching, watching a moth above" },
  { at = 2.0, pose = "mid-air pounce, all four paws reaching for the moth" },
  { at = 5.0, pose = "on its back in the grass after tumbling, paws up, delighted" },
]
action = "the kitten pounces at the moth, misses, tumbles over in the grass and springs back up"
sfx = [{ what = "moth wings flutter", at = 0.5 }, { what = "soft thump and grass rustle", at = 3.0 }]

[[shots]]
id = "s020"
set = "garden_morning"
seconds = 5
camera = "medium"
cast = ["cat:kitten2eye"]
keys = [
  { at = 0.0, pose = "sitting up, batting a dandelion clock with one paw" },
  { at = 3.0, pose = "the dandelion bursts into a cloud of seeds around the kitten's face, eyes wide with joy" },
]
action = "the kitten bats the dandelion until it bursts into seeds"
lines = [{ who = "cat", text = "Again!", at = 3.5, how = "giggling, tiny voice" }]
sfx = [{ what = "soft puff of seeds", at = 3.0 }]

[[shots]]
id = "s030"
set = "garden_morning"
seconds = 3
camera = "close"
move = "tilt_up"
cast = []
keys = [
  { at = 0.0, pose = "dandelion seeds drifting upward against the sky" },
  { at = 3.0, pose = "the seeds have become falling leaves against a dusk sky" },
]
action = "seeds drift upward and turn into falling leaves as the light goes from morning to dusk"
transition = "match_dissolve"

# ================================================================== EXT. ALLEY - DUSK
[[shots]]
id = "s040"
