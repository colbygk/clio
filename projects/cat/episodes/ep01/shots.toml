[[shots]]
id = "s160"
set = "yard_dusk"
seconds = 4
camera = "close"
cast = ["cat:2eye", "cat:3eye"]   # the hero moment: the variant changes during the shot
keys = [
  { at = 0.0, pose = "Codubee's face, two eyes; a thin seam of light appears on the forehead" },
  { at = 4.0, pose = "the third eye fully open on the forehead for the first time, all three eyes wide" },
]
action = "a seam of light on the forehead opens into a third eye"
sfx = [{ what = "a soft, low shimmer", at = 0.5 }]

[[shots]]
