# ComfyUI profile: private — personal work, kept out of the studio entirely.
#
# This is the original basedir/ layout unchanged: the full model store, basedir/{input,output,user}.
# What changes is how it is reached. It publishes on 127.0.0.1:8189 instead of 8188, and nginx
# fronts that on :8443 with a second gate — only client certificates named private-* get in
# (cluster/nginx/comfyui.conf.tmpl). A different port is a different browser origin, so open
# workflow tabs and other per-site browser state never carry across into the studio.
services:
  comfyui-nvidia:
    # Only clio-comfyui.service starts this container. Upstream's `restart: unless-stopped` let
    # dockerd bring it back at boot on its own (2026-10-23): before clio's NFS model store was
    # mounted (it saw an empty /store/models) and alongside vLLM on both nodes, which the unit's
    # Conflicts= exists to prevent.
    restart: "no"
    ports: !override
      - 127.0.0.1:8189:8188
    environment:
      # See studio.yaml: this replaces the upstream value, so it carries every base flag.
      COMFY_CMDLINE_EXTRA: --enable-assets --database-url sqlite:////basedir/user/comfyui.db --bf16-unet --bf16-vae --bf16-text-enc
