# Proxy settings for ComfyUI, included inside each `location /` — installed by 45-nginx.sh to
# /etc/nginx/snippets/clio-comfyui-proxy.conf. Only the upstream port differs between profiles.

proxy_http_version 1.1;

# ComfyUI's progress/preview channel is a WebSocket; without these it silently degrades
# to a UI that never updates while a job runs.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Pass the verified client identity through, so ComfyUI logs show who did what.
proxy_set_header X-Client-DN       $ssl_client_s_dn;

# Stream progress events straight through instead of buffering them into silence.
proxy_buffering off;
proxy_request_buffering off;
